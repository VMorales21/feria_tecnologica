<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil | Feria Tecnológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
  <div id="navbar"></div>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Mi perfil</h1>
        <p class="mb-0">Administra tu información dentro de la Feria Tecnológica.</p>
      </div>
    </section>

    <section class="page-content profile-page">
      <div class="container">
        <div id="profileAlert" class="alert d-none" role="alert"></div>

        <div class="row g-4">
          <div class="col-lg-4">
            <article class="card app-card profile-card h-100">
              <div class="card-body text-center p-4">
                <div class="profile-avatar-large mx-auto mb-3" id="profileAvatar" aria-label="Foto de perfil predeterminada">
                  <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false">
                    <circle cx="48" cy="31" r="18"></circle>
                    <path d="M18 82c0-17 13-29 30-29s30 12 30 29"></path>
                  </svg>
                </div>
                <h2 id="profileName" class="h4 mb-1">Saul Morales</h2>
                <p id="profileRole" class="text-muted mb-4">Participante</p>

                <label for="photoInput" class="btn btn-primary w-100 mb-2">Cambiar foto</label>
                <input id="photoInput" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/webp">
                <button id="removePhoto" class="btn btn-outline-secondary btn-sm" type="button">Restablecer foto</button>
              </div>
            </article>
          </div>

          <div class="col-lg-8">
            <article class="card app-card profile-card mb-4">
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
                  <div>
                    <h2 class="h4 mb-1">Información personal</h2>
                    <p class="text-muted mb-0">Actualiza los datos que se muestran en tu perfil.</p>
                  </div>
                  <span class="profile-status">Cuenta activa</span>
                </div>

                <form id="profileForm" novalidate>
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label" for="fullName">Nombre completo</label>
                      <input id="fullName" class="form-control" type="text" value="Saul Morales" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" for="email">Correo electrónico</label>
                      <input id="email" class="form-control" type="email" value="saul.morales@feria.test" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" for="phone">Teléfono</label>
                      <input id="phone" class="form-control" type="tel" value="55 0000 0000">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" for="role">Rol</label>
                      <select id="role" class="form-select">
                        <option selected>Participante</option>
                        <option>Expositor</option>
                        <option>Visitante</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="bio">Descripción</label>
                      <textarea id="bio" class="form-control" rows="3" placeholder="Cuéntanos brevemente sobre ti">Estudiante interesado en proyectos de tecnología e innovación.</textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-end">
                      <button class="btn btn-primary" type="submit">Guardar cambios</button>
                    </div>
                  </div>
                </form>
              </div>
            </article>

            <div class="row g-3">
              <div class="col-md-4"><div class="profile-stat"><strong>3</strong><span>Proyectos</span></div></div>
              <div class="col-md-4"><div class="profile-stat"><strong>2</strong><span>Eventos inscritos</span></div></div>
              <div class="col-md-4"><div class="profile-stat"><strong>8</strong><span>Actividades</span></div></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
