<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Búsqueda | Feria Tecnológica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="navbar"></div>
    <main>
        <section class="page-header">
            <div class="container">
                <h1>Búsqueda de Proyectos</h1>
                <p class="mb-0">Utiliza los filtros y la barra de búsqueda para encontrar proyectos, participantes o temas específicos dentro de la feria.</p>
            </div>
        </section>
        
        <section class="page-content py-4">
            <div class="container">
                <!-- Formulario de Búsqueda -->
                <div class="row mb-4">
                    <div class="col-md-8 mx-auto">
                        <div class="input-group mb-3">
                            <input type="text" id="inputBusqueda" class="form-control" placeholder="Buscar por nombre, categoría o autor..." aria-label="Buscar">
                            <button class="btn btn-primary" type="button" id="btnBuscar">Buscar</button>
                        </div>
                    </div>
                </div>

                <!-- Contenedor de Resultados -->
                <div class="row" id="resultadosBusqueda">
                    <div class="col-12 text-center text-muted">
                        <p>Ingresa un término de búsqueda para mostrar los resultados correspondientes.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
