<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Comentarios | Feria Tecnológica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  
  <div id="navbar"></div>


  <main>

    
    <section class="page-header">

      <div class="container">

        <h1>Comentarios</h1>

        <p class="mb-0">
          Comparte tus comentarios, sugerencias o dudas sobre la Feria Tecnológica.
        </p>

      </div>

    </section>


    
    <section class="page-content">

      <div class="container">

        <div class="row justify-content-center">

          <div class="col-lg-9 col-xl-8">

            <!-- TARJETA DE COMENTARIO -->
            <div class="comentario-card">


              
              <div class="comentario-titulo">

                <div class="comentario-icono">

                  <ion-icon name="chatbubble-outline"></ion-icon>

                </div>

                <div>

                  <h2>Agregar un comentario</h2>

                  <p>
                    Nos gustaría conocer tu opinión.
                  </p>

                </div>

              </div>


              
              <div class="mb-3">

                <textarea
                  id="comentario"
                  class="form-control comentario-textarea"
                  maxlength="500"
                  placeholder="Escribe tu comentario aquí..."
                  oninput="actualizarContador()"></textarea>

              </div>


              
              <div class="comentario-footer">

                <div></div>

                
                <div class="comentario-acciones">

                  <span id="contador">
                    0/500
                  </span>


                  
                  <button
                    type="button"
                    class="btn-enviar-comentario"
                    onclick="enviarComentario()"
                    title="Enviar comentario">

                    <ion-icon name="send-outline"></ion-icon>

                  </button>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>


  
  <div id="footer"></div>


  
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>


 
  <script src="../js/main.js"></script>


  
  <script
    type="module"
    src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js">
  </script>

  <script
    nomodule
    src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js">
  </script>


  
  <script>

    // Actualizar contador
    function actualizarContador() {

      const comentario =
        document.getElementById("comentario");

      const contador =
        document.getElementById("contador");

      contador.textContent =
        comentario.value.length + "/500";

    }


    // Enviar comentario
    function enviarComentario() {

      const comentario =
        document.getElementById("comentario").value.trim();


      if (comentario === "") {

        alert("Por favor, escribe un comentario antes de enviarlo.");

        return;

      }


      alert("Comentario enviado correctamente.");


      document.getElementById("comentario").value = "";

      actualizarContador();

    }

  </script>

</body>
</html>
