<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contacto | Feria Tecnológica</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar"></div><main><section class="page-header"><div class="container"><h1>Contacto</h1><p class="mb-0">Envíanos tus dudas o comentarios.</p></div></section><section class="page-content"><div class="container"><div class="card app-card"><div class="card-body p-4"><form onsubmit="return enviar(event)"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" required></div><div class="col-md-6"><label class="form-label">Correo</label><input type="email" class="form-control" required></div><div class="col-12"><label class="form-label">Mensaje</label><textarea class="form-control" rows="5" required></textarea></div><div class="col-12"><button class="btn btn-primary">Enviar mensaje</button></div></div></form></div></div></div></section></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/main.js"></script><script>function enviar(e){e.preventDefault();alert('Mensaje de demostración enviado.');return false;}</script></body></html>
