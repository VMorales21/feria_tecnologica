<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponentes | Feria Tecnológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <section class="page-header">
      <div class="container">
        <h1>Ponentes</h1>
        <p class="mb-0">Conoce a los expertos que compartirán su conocimiento y experiencia en la feria.</p>
      </div>
    </section>
    <section class="page-content">
      <div class="container">
        <!-- El alumno desarrolla aquí su módulo. -->
        <!-- Contenido principal -->
        <main class="container mb-5">
      
          <!--aqui inician controles -->
          <div class="card shadow-sm border-0 mb-4 rounded-3">
            <div class="card-body p-4">
              <div class="row g-3 align-items-end">
                
                <!-- aqui inicia busqueda -->
                <div class="col-lg-4 col-md-6">
                  <label for="buscarPonente" class="form-label small text-muted fw-semibold mb-1">Buscar ponente</label>
                  <input type="text" id="buscarPonente" class="form-control" placeholder="Buscar por nombre, tema o institución...">
                </div>
      
                <!-- aqui inicia filtro de área -->
                <div class="col-lg-3 col-md-3">
                  <label for="filtroArea" class="form-label small text-muted fw-semibold mb-1">Área temática</label>
                  <select id="filtroArea" class="form-select">
                    <option selected>Todas las areas</option>
                    <option value="1">Inteligencia Artificial</option>
                    <option value="2">Ciberseguridad</option>
                    <option value="3">Desarrollo Web</option>
                  </select>
                </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
