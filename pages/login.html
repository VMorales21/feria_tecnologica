<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Feria Tecnológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-card {
      max-width: 440px;
      margin: 0 auto;
      background: var(--color-white);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(15,23,42,.08);
    }
    .login-card .form-label { font-weight: 500; }
    .login-card .login-footer { color: var(--color-muted); }
    .login-card .login-footer a { color: var(--color-secondary); font-weight: 500; }
    .login-card .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <main>
    <section class="page-header">
      <div class="container">
        <h1>Iniciar sesión</h1>
        <p class="mb-0">Ingresa tus datos para acceder a la Feria Tecnológica.</p>
      </div>
    </section>
    <section class="page-content">
      <div class="container">
        <div class="login-card">
          <form action="/login" method="POST">
            <div class="mb-3">
              <label for="username" class="form-label">Nombre de usuario</label>
              <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Iniciar sesión</button>
          </form>
          <p class="login-footer text-center mt-4 mb-0">¿No tienes una cuenta? <a href="/register">Regístrate aquí</a></p>
        </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
