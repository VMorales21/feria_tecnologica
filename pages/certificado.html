<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo | Feria Tecnológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <section class="page-header">
      <div class="container">
        <h1>Nombre del módulo</h1>
        <p class="mb-0">Descripción breve del módulo.</p>
      </div>
    </section>
    <section class="page-content">
      <div class="container">
        
    
        <div class="row">
          <div class="col-lg-7 col-md-9">
            

            <!-- Tarjeta de felicitación -->
            <div class="card border-0 shadow-sm rounded-4 mb-4 p-4 certificate-card">
              <div class="card-body">
                <h4 class="fw-bold text-brand-blue mb-3">¡Felicidades!</h4>
                <p class="text-secondary mb-0 certificate-message">
                  Has logrado pasar exitosamente a la siguiente etapa. ¡Sigue así!
                </p>
              </div>
            </div>

            <!-- NUEVA Tarjeta para la imagen del certificado -->
            <div class="card border-0 shadow-sm rounded-4 mb-4 certificate-card">
              <div class="card-body p-4 text-center">
                <h5 class="fw-bold text-brand-blue mb-4">Tu Certificado Digital</h5>
                <!-- Reemplaza "RUTA_A_TU_IMAGEN.png" con la ubicación real de tu imagen -->
               <img src="certificado.jpeg" class="img-fluid rounded-3" alt="Certificado de Participación - Feria Tecnológica">
              </div>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
