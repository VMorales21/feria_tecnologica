<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo | Feria Tecnológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <section class="page-header">
      <div class="container">
        <h1>integrantes</h1>
        <p class="mb-0">Aqui se revisan los integrandes existentes y se agregan.</p>
      </div>
    </section>
    <section class="page-content">
      <div class="container">
        <!-- El alumno desarrolla aquí su módulo. -->
         <div class="card app-card mb-4">
          <div class="card-body p-4">
            <div class="row g-3 align-items-center">
              <!-- Búsqueda -->
              <div class="col-lg-5 col-md-6">
                <label for="buscarIntegrante" class="form-label small text-muted fw-bold mb-1">Buscar integrante</label>
                <input type="text" id="buscarIntegrante" class="form-control" placeholder="Buscar por nombre, correo o matrícula...">
              </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>

</html>
