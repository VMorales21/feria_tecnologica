<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de Asistencia | Feria Tecnológica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- Encabezado -->
  <div id="navbar"></div>

  <main>

    <section class="page-header">
      <div class="container">
        <h1>Lista de Asistencia</h1>
        <p class="mb-0">
          Registro de asistencia de los participantes de la Feria Tecnologica.
        </p>
      </div>
    </section>

    <!-- Contenido -->
    <section class="page-content">
      <div class="container">

        <div class="card p-4">

          <h3 class="mb-4">Datos del evento</h3>

          <div class="row mb-4">

            <div class="col-md-4">
              <label class="form-label">Evento</label>
              <input type="text" class="form-control" value="Feria Tecnológica">
            </div>

            <div class="col-md-4">
              <label class="form-label">Fecha</label>
              <input type="date" class="form-control">
            </div>

            <div class="col-md-4">
              <label class="form-label">Responsable</label>
              <input type="text" class="form-control" placeholder="Nombre del responsable">
            </div>

          </div>

          <h3 class="mb-3">Participantes</h3>

          <div class="table-responsive">

            <table class="table table-bordered">

              <thead>
                <tr>
                  <th>No.</th>
                  <th>Nombre del participante</th>
                  <th>Grupo</th>
                  <th>Hora de entrada</th>
                  <th>Asistencia</th>
                </tr>
              </thead>

              <tbody>

                <tr>
                  <td>1</td>
                  <td>Participante 1</td>
                  <td>Grupo A</td>
                  <td>
                    <input type="time" class="form-control">
                  </td>
                  <td>
                    <select class="form-select">
                      <option>Presente</option>
                      <option>Ausente</option>
                    </select>
                  </td>
                </tr>

                <tr>
                  <td>2</td>
                  <td>Participante 2</td>
                  <td>Grupo A</td>
                  <td>
                    <input type="time" class="form-control">
                  </td>
                  <td>
                    <select class="form-select">
                      <option>Presente</option>
                      <option>Ausente</option>
                    </select>
                  </td>
                </tr>

                <tr>
                  <td>3</td>
                  <td>Participante 3</td>
                  <td>Grupo B</td>
                  <td>
                    <input type="time" class="form-control">
                  </td>
                  <td>
                    <select class="form-select">
                      <option>Presente</option>
                      <option>Ausente</option>
                    </select>
                  </td>
                </tr>

              </tbody>

            </table>

          </div>

          <div class="text-end mt-3">
            <button type="button" class="btn btn-primary">
              Guardar asistencia
            </button>
          </div>

        </div>

      </div>
    </section>

  </main>

  <!-- Pie de pagina -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/main.js"></script>

</body>
</html>
